[project]
name = "comfyui-llm-bikeshed"
version = "0.2.1"
description = "ComfyUI custom nodes for local LLM text generation"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.comfy]
PublisherId = ""
DisplayName = "LLM Bikeshed"
Icon = ""

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]
