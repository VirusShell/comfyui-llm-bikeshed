[project]
name = "comfyui-llm-bikeshed"
version = "0.3.0"
description = "ComfyUI custom nodes for local LLM text generation"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "VirusShell", email = "22591047+VirusShell@users.noreply.github.com" }]
keywords = ["comfyui", "llm", "lm-studio", "text-generation-webui", "openai"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.urls]
Repository = "https://github.com/VirusShell/comfyui-llm-bikeshed"
Homepage = "https://github.com/VirusShell/comfyui-llm-bikeshed"
Documentation = "https://github.com/VirusShell/comfyui-llm-bikeshed#readme"
Issues = "https://github.com/VirusShell/comfyui-llm-bikeshed/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Used by Comfy Registry — https://registry.comfy.org
[tool.comfy]
# Set to your publisher ID (the part after @ on your registry profile).
PublisherId = "amvir"
DisplayName = "LLM Bikeshed"
Icon = ""
# requires-comfyui = ">=1.0.0"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]
