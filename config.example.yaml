# ComfyUI LLM Bikeshed — Provider Configuration
# Copy this file to config.yaml and adjust as needed.
# config.yaml is gitignored and will not be shared with workflows.
# After editing config.yaml, restart ComfyUI (there is no browser reload-config).

# Optional (not implemented yet): tune pack logging without code changes.
# logging:
#   level: "info"   # proposed: info | debug — applies once wired in Python logging setup

providers:
  lm_studio:
    url: "http://localhost:1234"
    timeout: 120
    # Optional when LM Studio / a proxy requires API auth. A key only under
    # oai_compat also authenticates Refresh Models + Generate (shared fallback).
    # api_key: "your-api-key-here"

  openai:
    url: "https://api.openai.com"
    timeout: 120
    # api_key: "your-api-key-here"

  text_gen_webui:
    url: "http://localhost:5000"
    timeout: 120
    # Textgen (oobabooga) may use two secrets (see docs/research/textgen-lifecycle-verified.md):
    #   api_key  — matches Textgen --api-key: Bearer for chat (POST /v1/chat/completions)
    #              and for GET /v1/internal/model/info when Textgen enforces a key.
    #   admin_key — matches Textgen --admin-key: Bearer for GET /v1/internal/model/list
    #              and POST /v1/internal/model/load|unload when Textgen enforces it.
    # If only one flag is set in Textgen, put the same value in both fields here.
    # api_key: "your-api-key-here"
    # admin_key: "your-admin-key-here"

  oai_compat:
    timeout: 120
    # Shared key slot for "LLM Provider: OAI Compatible" and fallback for
    # lm_studio / openai / llamacpp / generic OAI-shaped backends (list + chat).
    # For Textgen URLs these also merge with providers.text_gen_webui
    # (see get_textgen_auth_keys). Prefer text_gen_webui.* for Textgen dual keys.
    # api_key: "your-api-key-here"
    # admin_key: "your-admin-key-here"  # optional; Textgen merge only

  # llamacpp: no dedicated YAML slot required. Point OAI Compatible at the
  # server URL and put the key under oai_compat (or set env
  # LLM_BIKESHED_LLAMACPP_API_KEY / add a providers.llamacpp.api_key block).
