# ComfyUI LLM Bikeshed — Provider Configuration
# Copy this file to config.yaml and adjust as needed.
# config.yaml is gitignored and will not be shared with workflows.

providers:
  lm_studio:
    url: "http://localhost:1234"
    timeout: 120
    # api_key: "your-api-key-here"

  openai:
    url: "https://api.openai.com"
    timeout: 120
    # api_key: "your-api-key-here"

  text_gen_webui:
    url: "http://localhost:5000"
    timeout: 120
    # api_key: same as Textgen --api-key (chat + GET /v1/internal/model/info).
    # admin_key: same as Textgen --admin-key (GET /v1/internal/model/list, load, unload).
    # api_key: "your-api-key-here"
    # admin_key: "your-admin-key-here"

  oai_compat:
    timeout: 120
    # If you only use LLM Provider: OAI Compatible, keys here are used for
    # OpenAI-style backends and also as fallback when the URL is Textgen.
    # api_key: "your-api-key-here"
