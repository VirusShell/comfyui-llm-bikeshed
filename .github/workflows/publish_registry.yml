name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "pyproject.toml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Require project.version bump on push
        if: github.event_name == 'push'
        id: version_bump
        shell: bash
        run: |
          if git diff HEAD~1 HEAD -- pyproject.toml | grep -Eq '^[+-]version[[:space:]]*='; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping registry publish: pyproject.toml changed without a version bump."
          fi

      - name: Publish Custom Node
        if: github.event_name == 'workflow_dispatch' || steps.version_bump.outputs.bumped == 'true'
        # Pin SHA: publish-node-action@1.0.1 breaks on comfy-cli 1.10.4 (`comfy --yes env` fails); this SHA matches successful 1.0.0 publish.
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          # Official name per docs.comfy.org; fallback if user used COMFY_REGISTRY_API_KEY
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN || secrets.COMFY_REGISTRY_API_KEY }}
          skip_checkout: true
